# Optional fallback only.
# Preferred setup: reuse the already-running pgvector container:
#   Name: pgvector-db
#   Image: pgvector/pgvector:pg18
#   Port: 5433
#   DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5433/travel_agent
#
# Start this compose stack only if that container is not available.

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: travel_agent_db
    profiles: ["standalone"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-travel_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - travel_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_agent_pgdata:
